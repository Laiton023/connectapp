<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0f14; color: #e8eaf2; font-family: 'Poppins', sans-serif; }
    header { background: linear-gradient(135deg, #5b6ef5, #f56b6b); padding: 20px; text-align: center; }
    header h1 { font-size: 28px; font-weight: 700; color: white; }
    header p { color: rgba(255,255,255,0.8); font-size: 14px; }
    nav { background: #161920; display: flex; justify-content: center; gap: 30px; padding: 14px; border-bottom: 1px solid #2a2f42; position: sticky; top: 0; }
    nav a { color: #6b7280; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 16px; border-radius: 20px; transition: all 0.2s; }
    nav a:hover { background: #5b6ef5; color: white; }
    main, #perfil, #chat { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    textarea { width: 100%; background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 12px; padding: 14px; font-family: 'Poppins', sans-serif; font-size: 14px; height: 90px; resize: none; outline: none; }
    textarea:focus { border-color: #5b6ef5; }
    button { background: #5b6ef5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; margin-right: 6px; transition: all 0.2s; }
    button:hover { background: #4a5de8; transform: translateY(-1px); }
    div { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 18px; margin-top: 16px; transition: border-color 0.2s; }
    div:hover { border-color: #5b6ef5; }
    #perfil { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 24px; text-align: center; }
    #fotoPerfil { border: 3px solid #5b6ef5; }
    input[type="text"] { background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; width: 75%; outline: none; }
    footer { text-align: center; padding: 20px; color: #6b7280; font-size: 13px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <h1>🌐 ConnectApp</h1>
    <p>Bem-vindo, João!</p>
  </header>

  <nav>
    <a href="#">Feed</a>
    <a href="#" onclick="verPerfil()">Perfil</a>
    <a href="#" onclick="verChat()">Chat</a>
  </nav>

  <main>
    <h2 style="margin-bottom:16px;">Feed</h2>
    <textarea placeholder="O que você está pensando?"></textarea>
    <br>
    <button onclick="publicar()">Publicar</button>

    <div>
      <strong>Maria</strong> · há 2 min
      <p>Olá! Esse é meu primeiro post 🎉</p>
      <button onclick="curtir(this)">❤️ Curtir</button>
      <button>💬 Comentar</button>
      <button onclick="deletar(this)">🗑️ Deletar</button>
    </div>
  </main>

  <div id="perfil" style="display:none">
    <h2>👤 Meu Perfil</h2>
    <img id="fotoPerfil" src="https://via.placeholder.com/100"
    style="border-radius:50%; width:100px; height:100px; margin-top:16px;">
    <br><br>
    <input type="file" accept="image/*" onchange="trocarFoto(event)">
    <br><br>
    <p><strong>Nome:</strong> João</p>
    <p><strong>Bio:</strong> Aprendendo a programar! 🚀</p>
    <p><strong>Posts:</strong> 0</p>
  </div>

  <div id="chat" style="display:none; max-width:600px; margin:24px auto; padding:0 16px;">
    <h2>💬 Chat</h2>
    <div id="mensagens" style="height:200px; overflow-y:auto; background:#0d0f14; padding:10px; border-radius:10px; margin-top:12px;"></div>
    <br>
    <input id="inputMsg" type="text" placeholder="Digite uma mensagem...">
    <button onclick="enviarMsg()">Enviar</button>
  </div>

  <footer>
    <p>Feito por mim 🚀</p>
  </footer>

  <script>
    function publicar() {
      let caixa = document.querySelector("textarea");
      let texto = caixa.value;
      if (texto === "") { alert("Escreva algo antes de publicar!"); return; }
      let feed = document.querySelector("main");
      let novoPost = document.createElement("div");
      novoPost.innerHTML = `
        <strong>Você</strong> · agora
        <p>${texto}</p>
        <button onclick="curtir(this)">❤️ Curtir</button>
        <button>💬 Comentar</button>
        <button onclick="deletar(this)">🗑️ Deletar</button>
      `;
      feed.appendChild(novoPost);
      caixa.value = "";
    }

    function deletar(botao) {
      botao.parentElement.remove();
    }

    function curtir(botao) {
      let curtidas = botao.getAttribute("data-curtidas") || 0;
      curtidas = parseInt(curtidas) + 1;
      botao.setAttribute("data-curtidas", curtidas);
      botao.textContent = "❤️ Curtir (" + curtidas + ")";
    }

    function verPerfil() {
      let perfil = document.getElementById("perfil");
      perfil.style.display = perfil.style.display === "none" ? "block" : "none";
    }

    function trocarFoto(event) {
      let leitor = new FileReader();
      leitor.onload = function(e) {
        document.getElementById("fotoPerfil").src = e.target.result;
      };
      leitor.readAsDataURL(event.target.files[0]);
    }

    function verChat() {
      let chat = document.getElementById("chat");
      chat.style.display = chat.style.display === "none" ? "block" : "none";
    }

    function enviarMsg() {
      let input = document.getElementById("inputMsg");
      let texto = input.value;
      if (texto === "") return;
      let mensagens = document.getElementById("mensagens");
      let msg = document.createElement("p");
      msg.innerHTML = "<strong>Você:</strong> " + texto;
      mensagens.appendChild(msg);
      input.value = "";
    }
  </script>

</body>
</html>
