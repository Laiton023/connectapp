<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0f14; color: #e8eaf2; font-family: 'Poppins', sans-serif; }
    header { background: linear-gradient(135deg, #5b6ef5, #f56b6b); padding: 20px; text-align: center; }
    header h1 { font-size: 28px; font-weight: 700; color: white; }
    header p { color: rgba(255,255,255,0.8); font-size: 14px; }
    #onlineBar { background: #161920; text-align: center; padding: 6px; font-size: 13px; color: #4ecb8d; border-bottom: 1px solid #2a2f42; }
    nav { background: #161920; display: flex; justify-content: center; gap: 20px; padding: 14px; border-bottom: 1px solid #2a2f42; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }
    nav a { color: #6b7280; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 16px; border-radius: 20px; transition: all 0.2s; }
    nav a:hover { background: #5b6ef5; color: white; }
    main, #perfil, #chatDiv { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    textarea { width: 100%; background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 12px; padding: 14px; font-family: 'Poppins', sans-serif; font-size: 14px; height: 90px; resize: none; outline: none; }
    textarea:focus { border-color: #5b6ef5; }
    button { background: #5b6ef5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; margin-right: 6px; transition: all 0.2s; }
    button:hover { background: #4a5de8; transform: translateY(-1px); }
    .post-card { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 18px; margin-top: 16px; }
    .comentarios-box { margin-top: 12px; border-top: 1px solid #2a2f42; padding-top: 12px; display: none; }
    .comentario-item { background: #0d0f14; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
    .comentario-input { width: 100%; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px; font-family: 'Poppins', sans-serif; font-size: 13px; outline: none; margin-top: 8px; }
    #perfil { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 24px; text-align: center; }
    input[type="text"] { background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; width: 75%; outline: none; }
    footer { text-align: center; padding: 20px; color: #6b7280; font-size: 13px; margin-top: 30px; }
    #status { text-align: center; color: #4ecb8d; font-size: 13px; max-width: 600px; margin: 8px auto; padding: 0 16px; }
    #loginTela { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0f14; display: flex; align-items: center; justify-content: center; z-index: 999; }
    .login-box { background: #1e2230; border: 1px solid #2a2f42; border-radius: 20px; padding: 40px 30px; text-align: center; width: 90%; max-width: 400px; }
    .login-box h2 { font-size: 24px; margin-bottom: 8px; color: #5b6ef5; }
    .login-box p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 10px; padding: 14px; font-family: 'Poppins', sans-serif; font-size: 16px; outline: none; margin-bottom: 16px; }
    .login-box input:focus { border-color: #5b6ef5; }
    .login-box button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; }
    #chatDiv { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 20px; }
    #mensagens { height: 300px; overflow-y: auto; background: #0d0f14; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg-item { padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: 80%; }
    .msg-minha { background: #5b6ef5; color: white; align-self: flex-end; }
    .msg-outro { background: #2a2f42; color: #e8eaf2; align-self: flex-start; }
    .chat-input-box { display: flex; gap: 8px; margin-top: 12px; }
    .chat-input-box input { flex: 1; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none; width: auto; }
    .chat-input-box button { margin-top: 0; }
  </style>
</head>
<body>
  <div id="loginTela">
    <div class="login-box">
      <h2>🌐 ConnectApp</h2>
      <p>Entre com seu nome para começar!</p>
      <input type="text" id="inputNome" placeholder="Seu nome..." maxlength="20">
      <button onclick="entrar()">Entrar 🚀</button>
    </div>
  </div>
  <header>
    <h1>🌐 ConnectApp</h1>
    <p id="bemVindo">Bem-vindo!</p>
  </header>
  <div id="onlineBar">🟢 <span id="onlineCount">0</span> pessoa(s) online agora</div>
  <nav>
    <a href="#" onclick="mostrarFeed()">Feed</a>
    <a href="#" onclick="verPerfil()">Perfil</a>
    <a href="#" onclick="verChat()">💬 Chat</a>
    <a href="#" onclick="sair()" style="color:#f56b6b;">Sair</a>
  </nav>
  <div id="status"></div>
  <main id="feedDiv">
    <h2 style="margin-bottom:16px;">Feed</h2>
    <textarea id="caixaTexto" placeholder="O que você está pensando?"></textarea>
    <br>
    <button onclick="publicar()">Publicar</button>
    <div id="posts"></div>
  </main>
  <div id="perfil" style="display:none">
    <h2>👤 Meu Perfil</h2>
    <img id="fotoPerfil" src="https://via.placeholder.com/100" style="border-radius:50%; width:100px; height:100px; margin-top:16px;">
    <br><br>
    <input type="file" accept="image/*" onchange="trocarFoto(event)">
    <br><br>
    <p id="nomePerfilTexto"><strong>Nome:</strong> </p>
    <p><strong>Bio:</strong> Utilizador do ConnectApp! 🚀</p>
  </div>
  <div id="chatDiv" style="display:none; max-width:600px; margin:24px auto; padding:20px 16px;">
    <h2>💬 Chat em Tempo Real</h2>
    <div id="mensagens"></div>
    <div class="chat-input-box">
      <input id="inputMsg" type="text" placeholder="Digite uma mensagem...">
      <button onclick="enviarMsg()">Enviar</button>
    </div>
  </div>
  <footer><p>Feito por Laiton 🚀</p></footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query, serverTimestamp, onSnapshot, setDoc, deleteField, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCoACMoICD9HvY-qkmlebrVl23qjJIsqzE",
      authDomain: "connectapp-f32f7.firebaseapp.com",
      projectId: "connectapp-f32f7",
      storageBucket: "connectapp-f32f7.firebasestorage.app",
      messagingSenderId: "731492243198",
      appId: "1:731492243198:web:a51d5ff6b6ec3eeb38b7af"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let nomeUsuario = localStorage.getItem("nomeUsuario") || "";
    let sessionId = Math.random().toString(36).substr(2, 9);

    if (nomeUsuario) {
      document.getElementById("loginTela").style.display = "none";
      document.getElementById("bemVindo").textContent = "Bem-vindo, " + nomeUsuario + "!";
      document.getElementById("nomePerfilTexto").innerHTML = "<strong>Nome:</strong> " + nomeUsuario;
      carregarPosts();
      registarOnline();
    }

    // Registar utilizador online
    async function registarOnline() {
      try {
        await setDoc(doc(db, "online", sessionId), { nome: nomeUsuario, timestamp: serverTimestamp() });
        // Remover quando sair
        window.addEventListener("beforeunload", () => {
          deleteDoc(doc(db, "online", sessionId));
        });
        // Contador em tempo real
        onSnapshot(collection(db, "online"), (snap) => {
          document.getElementById("onlineCount").textContent = snap.size;
        });
      } catch(e) {}
    }

    window.entrar = function() {
      const nome = document.getElementById("inputNome").value.trim();
      if (!nome) { alert("Digite seu nome!"); return; }
      nomeUsuario = nome;
      localStorage.setItem("nomeUsuario", nome);
      document.getElementById("loginTela").style.display = "none";
      document.getElementById("bemVindo").textContent = "Bem-vindo, " + nome + "!";
      document.getElementById("nomePerfilTexto").innerHTML = "<strong>Nome:</strong> " + nome;
      carregarPosts();
      registarOnline();
    }
    window.sair = function() {
      if (confirm("Quer sair?")) {
        deleteDoc(doc(db, "online", sessionId));
        localStorage.removeItem("nomeUsuario");
        location.reload();
      }
    }
    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
      setTimeout(() => document.getElementById("status").textContent = "", 3000);
    }
    async function carregarPosts() {
      const postsDiv = document.getElementById("posts");
      postsDiv.innerHTML = "<p style='color:#6b7280;text-align:center;margin-top:16px;'>Carregando...</p>";
      try {
        const q = query(collection(db, "posts"), orderBy("data", "desc"));
        const snap = await getDocs(q);
        postsDiv.innerHTML = "";
        snap.forEach((d) => {
          const p = d.data();
          const div = document.createElement("div");
          div.className = "post-card";
          div.innerHTML = `
            <strong>${p.autor}</strong> · <span style="color:#6b7280;font-size:12px;">${p.hora}</span>
            <p style="margin:10px 0;color:#c8cad8;">${p.texto}</p>
            <button onclick="curtir(this)">❤️ Curtir</button>
            <button onclick="toggleComentarios('${d.id}')">💬 Comentar</button>
            <button onclick="deletarPost('${d.id}',this)">🗑️ Deletar</button>
            <div class="comentarios-box" id="coms-${d.id}">
              <div id="lista-coms-${d.id}"></div>
              <input class="comentario-input" id="input-com-${d.id}" placeholder="Escreva um comentário...">
              <button onclick="enviarComentario('${d.id}')">Enviar</button>
            </div>
          `;
          postsDiv.appendChild(div);
          carregarComentarios(d.id);
        });
        if (snap.empty) postsDiv.innerHTML = "<p style='color:#6b7280;text-align:center;margin-top:16px;'>Nenhum post ainda!</p>";
      } catch(e) { postsDiv.innerHTML = "<p style='color:#f56b6b;'>Erro ao carregar.</p>"; }
    }
    async function carregarComentarios(postId) {
      const lista = document.getElementById("lista-coms-" + postId);
      if (!lista) return;
      try {
        const q = query(collection(db, "posts", postId, "comentarios"), orderBy("data", "asc"));
        const snap = await getDocs(q);
        lista.innerHTML = "";
        snap.forEach((d) => {
          const c = d.data();
          const div = document.createElement("div");
          div.className = "comentario-item";
          div.innerHTML = `<strong>${c.autor}:</strong> ${c.texto}`;
          lista.appendChild(div);
        });
      } catch(e) {}
    }
    window.toggleComentarios = function(postId) {
      const box = document.getElementById("coms-" + postId);
      box.style.display = box.style.display === "block" ? "none" : "block";
    }
    window.enviarComentario = async function(postId) {
      const input = document.getElementById("input-com-" + postId);
      const texto = input.value.trim();
      if (!texto) return;
      try {
        await addDoc(collection(db, "posts", postId, "comentarios"), { texto, autor: nomeUsuario, data: serverTimestamp() });
        input.value = "";
        carregarComentarios(postId);
      } catch(e) {}
    }
    window.publicar = async function() {
      const caixa = document.getElementById("caixaTexto");
      const texto = caixa.value.trim();
      if (!texto) { alert("Escreva algo!"); return; }
      try {
        const hora = new Date().toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});
        await addDoc(collection(db, "posts"), { texto, autor: nomeUsuario, hora, data: serverTimestamp() });
        caixa.value = "";
        setStatus("✅ Post publicado!");
        carregarPosts();
      } catch(e) { setStatus("❌ Erro ao publicar."); }
    }
    window.deletarPost = async function(id, botao) {
      try { await deleteDoc(doc(db, "posts", id)); botao.parentElement.remove(); setStatus("🗑️ Deletado!"); }
      catch(e) { setStatus("❌ Erro ao deletar."); }
    }
    window.curtir = function(botao) {
      let c = parseInt(botao.getAttribute("data-curtidas") || 0) + 1;
      botao.setAttribute("data-curtidas", c);
      botao.textContent = "❤️ Curtir (" + c + ")";
    }
    window.verPerfil = function() { document.getElementById("feedDiv").style.display="none"; document.getElementById("chatDiv").style.display="none"; document.getElementById("perfil").style.display="block"; }
    window.mostrarFeed = function() { document.getElementById("feedDiv").style.display="block"; document.getElementById("chatDiv").style.display="none"; document.getElementById("perfil").style.display="none"; }
    window.trocarFoto = function(e) { const r=new FileReader(); r.onload=function(x){document.getElementById("fotoPerfil").src=x.target.result;}; r.readAsDataURL(e.target.files[0]); }
    window.verChat = function() {
      document.getElementById("feedDiv").style.display="none";
      document.getElementById("perfil").style.display="none";
      document.getElementById("chatDiv").style.display="block";
      iniciarChat();
    }
    let chatIniciado = false;
    function iniciarChat() {
      if (chatIniciado) return;
      chatIniciado = true;
      const q = query(collection(db, "chat"), orderBy("data", "asc"));
      onSnapshot(q, (snap) => {
        const mensagens = document.getElementById("mensagens");
        mensagens.innerHTML = "";
        snap.forEach((d) => {
          const m = d.data();
          const div = document.createElement("div");
          div.className = "msg-item " + (m.autor === nomeUsuario ? "msg-minha" : "msg-outro");
          div.innerHTML = m.autor === nomeUsuario ? m.texto : `<strong>${m.autor}:</strong> ${m.texto}`;
          mensagens.appendChild(div);
        });
        mensagens.scrollTop = mensagens.scrollHeight;
      });
    }
    window.enviarMsg = async function() {
      const i = document.getElementById("inputMsg");
      const texto = i.value.trim();
      if (!texto) return;
      try {
        await addDoc(collection(db, "chat"), { texto, autor: nomeUsuario, data: serverTimestamp() });
        i.value = "";
      } catch(e) {}
    }
    document.getElementById("inputMsg").addEventListener("keypress", function(e) {
      if (e.key === "Enter") window.enviarMsg();
    });
  </script>
</body>
        </html>
