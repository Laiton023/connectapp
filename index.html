<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --cor1: #5b6ef5; --cor2: #f56b6b; }
    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
    body { background: #0d0f14; color: #e8eaf2; font-family: 'Poppins', sans-serif; }
    body.claro { background: #f0f2f5; color: #1a1a2e; }
    header { background: linear-gradient(135deg, var(--cor1), var(--cor2)); padding: 20px; text-align: center; }
    header h1 { font-size: 28px; font-weight: 700; color: white; }
    header p { color: rgba(255,255,255,0.8); font-size: 14px; }
    #onlineBar { background: #161920; text-align: center; padding: 6px; font-size: 13px; color: #4ecb8d; border-bottom: 1px solid #2a2f42; }
    body.claro #onlineBar { background: #e0e3eb; color: #2d7a4f; border-bottom: 1px solid #c0c4d0; }
    nav { background: #161920; display: flex; justify-content: center; gap: 10px; padding: 14px; border-bottom: 1px solid #2a2f42; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; align-items: center; }
    body.claro nav { background: #ffffff; border-bottom: 1px solid #dde1ed; }
    nav a { color: #6b7280; text-decoration: none; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 20px; transition: all 0.2s; position: relative; }
    nav a:hover { background: var(--cor1); color: white; }
    .notif-dot { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; background: var(--cor2); border-radius: 50%; display: none; }
    #modoBtn { background: none; border: 1px solid #2a2f42; border-radius: 20px; padding: 6px 14px; color: #e8eaf2; font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer; margin-top: 0; }
    body.claro #modoBtn { border-color: #c0c4d0; color: #1a1a2e; }
    main, #perfil, #chatDiv, #utilizadoresDiv, #gruposDiv, #grupoDetalheDiv, #mensagensListaDiv, #dmConversaDiv, #perfilOutroDiv, #temaDiv, #onlineDiv { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    textarea { width: 100%; background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 12px; padding: 14px; font-family: 'Poppins', sans-serif; font-size: 14px; height: 90px; resize: none; outline: none; }
    body.claro textarea { background: #ffffff; color: #1a1a2e; border-color: #c0c4d0; }
    textarea:focus { border-color: var(--cor1); }
    button { background: var(--cor1); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; margin-right: 6px; transition: all 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-whatsapp { background: #25d366; } .btn-whatsapp:hover { background: #1da851; }
    .btn-seguir { background: var(--cor2); }
    .btn-seguindo { background: #2a2f42; }
    .btn-editar { background: #f0a500; }
    .btn-guardar { background: #2a2f42; }
    .btn-guardar.ativo { background: #f0a500; }
    .sondagem-opcao { background: #0d0f14; border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; cursor: pointer; font-size: 13px; position: relative; overflow: hidden; }
    body.claro .sondagem-opcao { background: #f0f2f5; }
    .sondagem-barra { position: absolute; left: 0; top: 0; height: 100%; background: var(--cor1); opacity: 0.25; border-radius: 8px; transition: width 0.5s; }
    .sondagem-texto { position: relative; z-index: 1; display: flex; justify-content: space-between; }
    .sondagem-total { font-size: 11px; color: #6b7280; margin-top: 4px; }
    .btn-danger { background: #f56b6b; }
    .nome-clicavel { cursor: pointer; } .nome-clicavel:hover { text-decoration: underline; }
    .post-card { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 18px; margin-top: 16px; }
    body.claro .post-card { background: #ffffff; border-color: #dde1ed; }
    .post-img { width: 100%; border-radius: 10px; margin: 10px 0; max-height: 300px; object-fit: cover; }
    .edit-box { display: none; margin-top: 10px; }
    .edit-box textarea { height: 70px; margin-bottom: 6px; }
    .badge-verificado { font-size: 12px; vertical-align: middle; margin-left: 2px; }
    .hashtag { color: var(--cor1); font-weight: 600; cursor: pointer; } .hashtag:hover { text-decoration: underline; }
    #trendingBar { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    body.claro #trendingBar { background: #ffffff; border-color: #dde1ed; }
    .trending-titulo { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .trending-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .hashtag-chip { background: #0d0f14; border: 1px solid #2a2f42; color: var(--cor1); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600; margin: 0; }
    body.claro .hashtag-chip { background: #f0f2f5; border-color: #c0c4d0; }
    .hashtag-chip:hover { background: var(--cor1); color: white; }
    .hashtag-chip small { color: #6b7280; font-weight: 400; }
    .reacoes-bar { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0; }
    .reacao-btn { background: #0d0f14; border: 1px solid #2a2f42; color: #e8eaf2; padding: 6px 10px; border-radius: 20px; font-size: 13px; cursor: pointer; margin: 0; transition: all 0.2s; }
    body.claro .reacao-btn { background: #f0f2f5; border-color: #c0c4d0; color: #1a1a2e; }
    .reacao-btn:hover { background: #2a2f42; transform: scale(1.08); }
    .reacao-btn.active { background: var(--cor1); border-color: var(--cor1); color: white; }
    .comentarios-box { margin-top: 12px; border-top: 1px solid #2a2f42; padding-top: 12px; display: none; }
    body.claro .comentarios-box { border-top-color: #dde1ed; }
    .comentario-item { background: #0d0f14; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
    body.claro .comentario-item { background: #f0f2f5; color: #1a1a2e; }
    .comentario-input { width: 100%; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px; font-family: 'Poppins', sans-serif; font-size: 13px; outline: none; margin-top: 8px; }
    body.claro .comentario-input { background: #f0f2f5; color: #1a1a2e; border-color: #c0c4d0; }
    #perfil, #perfilOutroDiv { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 24px; text-align: center; }
    body.claro #perfil, body.claro #perfilOutroDiv { background: #ffffff; border-color: #dde1ed; }
    .outro-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--cor1), var(--cor2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px; color: white; margin: 0 auto 12px; }
    #outroBioTexto { color: #6b7280; font-size: 13px; margin-top: 6px; }
    .perfil-stats { display: flex; justify-content: center; gap: 30px; margin: 16px 0; }
    .perfil-stat { text-align: center; }
    .perfil-stat strong { display: block; font-size: 22px; color: var(--cor1); }
    .perfil-stat span { font-size: 12px; color: #6b7280; }
    #statusVerificado { margin-top: 6px; font-size: 13px; color: #6b7280; }
    .notificacoes-box { text-align: left; margin-top: 20px; border-top: 1px solid #2a2f42; padding-top: 16px; }
    .notificacoes-box h3 { font-size: 15px; margin-bottom: 10px; }
    .notif-item { background: #0d0f14; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    body.claro .notif-item { background: #f0f2f5; color: #1a1a2e; }
    .notif-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--cor1), var(--cor2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
    input[type="text"] { background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; width: 75%; outline: none; }
    body.claro input[type="text"] { background: #ffffff; color: #1a1a2e; border-color: #c0c4d0; }
    #pesquisaBox { width: 100%; background: #1e2230; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 10px; padding: 12px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none; margin-bottom: 16px; }
    body.claro #pesquisaBox { background: #ffffff; color: #1a1a2e; border-color: #c0c4d0; }
    .img-preview { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 200px; object-fit: cover; display: none; }
    .img-label { display: inline-block; background: #2a2f42; color: #e8eaf2; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 8px; }
    body.claro .img-label { background: #e0e3eb; color: #1a1a2e; }
    .utilizador-card { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 16px; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    body.claro .utilizador-card { background: #ffffff; border-color: #dde1ed; }
    .utilizador-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .utilizador-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--cor1), var(--cor2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: white; flex-shrink: 0; }
    .utilizador-nome { font-weight: 600; font-size: 14px; }
    .utilizador-bio { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .utilizador-acoes { display: flex; gap: 6px; flex-shrink: 0; }
    .utilizador-acoes button { margin: 0; }
    #gruposDiv input[type="text"], #gruposDiv textarea { width: 100%; margin-bottom: 8px; }
    .grupo-card { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 16px; margin-top: 12px; }
    body.claro .grupo-card { background: #ffffff; border-color: #dde1ed; }
    .grupo-card h3 { font-size: 15px; margin-bottom: 4px; }
    .grupo-card p { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .grupo-icone { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--cor1), var(--cor2)); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 8px; }
    .post-grupo { background: #0d0f14; border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 13px; }
    body.claro .post-grupo { background: #f0f2f5; color: #1a1a2e; }
    .post-grupo .pg-info { color: #6b7280; font-size: 11px; margin-top: 4px; }
    #dmMensagens { height: 350px; overflow-y: auto; background: #0d0f14; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    body.claro #dmMensagens { background: #f0f2f5; }
    #storiesBar { max-width: 600px; margin: 16px auto 0; padding: 0 16px; }
    .stories-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
    .story-avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--cor1); overflow: hidden; background: #1e2230; display: flex; align-items: center; justify-content: center; }
    .story-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .story-avatar-add { background: linear-gradient(135deg, var(--cor1), var(--cor2)); font-size: 24px; }
    .story-nome { font-size: 11px; color: #6b7280; text-align: center; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #storyViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; justify-content: center; align-items: center; }
    #storyViewer img { max-width: 100%; max-height: 80vh; border-radius: 10px; }
    #storyViewer .story-info { position: absolute; top: 20px; left: 20px; color: white; font-weight: 600; }
    #storyViewer .story-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 28px; cursor: pointer; background: none; border: none; padding: 0; margin: 0; }
    /* TEMAS */
    #temaDiv { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 24px; }
    body.claro #temaDiv { background: #ffffff; border-color: #dde1ed; }
    .temas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .tema-btn { border-radius: 12px; height: 70px; cursor: pointer; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: white; margin: 0; padding: 0; transition: all 0.2s; }
    .tema-btn:hover { transform: scale(1.05); border-color: white; }
    .tema-btn.ativo { border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,0.3); }
    footer { text-align: center; padding: 20px; color: #6b7280; font-size: 13px; margin-top: 30px; }
    #status { text-align: center; color: #4ecb8d; font-size: 13px; max-width: 600px; margin: 8px auto; padding: 0 16px; }
    #loginTela { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0f14; display: flex; align-items: center; justify-content: center; z-index: 999; }
    body.claro #loginTela { background: #f0f2f5; }
    .login-box { background: #1e2230; border: 1px solid #2a2f42; border-radius: 20px; padding: 40px 30px; text-align: center; width: 90%; max-width: 400px; }
    body.claro .login-box { background: #ffffff; border-color: #dde1ed; }
    .login-box h2 { font-size: 24px; margin-bottom: 8px; color: var(--cor1); }
    .login-box p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 10px; padding: 14px; font-family: 'Poppins', sans-serif; font-size: 16px; outline: none; margin-bottom: 16px; }
    body.claro .login-box input { background: #f0f2f5; color: #1a1a2e; border-color: #c0c4d0; }
    .login-box button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; }
    #chatDiv { background: #1e2230; border: 1px solid #2a2f42; border-radius: 14px; padding: 20px; }
    body.claro #chatDiv { background: #ffffff; border-color: #dde1ed; }
    #mensagens { height: 300px; overflow-y: auto; background: #0d0f14; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
    body.claro #mensagens { background: #f0f2f5; }
    .msg-item { padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: 80%; }
    .msg-minha { background: var(--cor1); color: white; align-self: flex-end; }
    .msg-outro { background: #2a2f42; color: #e8eaf2; align-self: flex-start; }
    body.claro .msg-outro { background: #dde1ed; color: #1a1a2e; }
    .chat-input-box { display: flex; gap: 8px; margin-top: 12px; }
    .chat-input-box input { flex: 1; background: #0d0f14; color: #e8eaf2; border: 1px solid #2a2f42; border-radius: 8px; padding: 10px 14px; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none; width: auto; }
    body.claro .chat-input-box input { background: #f0f2f5; color: #1a1a2e; border-color: #c0c4d0; }
    .chat-input-box button { margin-top: 0; }
  </style>
</head>
<body>
  <div id="loginTela">
    <div class="login-box">
      <h2>🌐 ConnectApp</h2>
      <p>Entre com seu nome para começar!</p>
      <input type="text" id="inputNome" placeholder="Seu nome..." maxlength="20">
      <button onclick="entrar()">Entrar 🚀</button>
    </div>
  </div>
  <header><h1>🌐 ConnectApp</h1><p id="bemVindo">Bem-vindo!</p></header>
  <div id="onlineBar" onclick="verOnline()" style="cursor:pointer;">🟢 <span id="onlineCount">0</span> pessoa(s) online agora — toca para ver</div>
  <nav>
    <a href="#" onclick="mostrarFeed()">Feed</a>
    <a href="#" onclick="verUtilizadores()">👥 Users</a>
    <a href="#" onclick="verGrupos()">🏘️ Grupos</a>
    <a href="#" onclick="verMensagens()">✉️ Msgs<span class="notif-dot" id="dmNotif"></span></a>
    <a href="#" onclick="verPerfil()">Perfil<span class="notif-dot" id="perfilNotif"></span></a>
    <a href="#" onclick="verChat()">💬 Chat<span class="notif-dot" id="chatNotif"></span></a>
    <a href="#" onclick="verTema()">🎨 Tema</a>
    <a href="#" onclick="sair()" style="color:var(--cor2);">Sair</a>
    <button id="modoBtn" onclick="toggleModo()">🌙 Escuro</button>
  </nav>
  <div id="status"></div>
  <div id="storiesBar">
    <div class="stories-container" id="storiesContainer">
      <div class="story-item" onclick="document.getElementById('inputStory').click()">
        <div class="story-avatar story-avatar-add">+</div>
        <span class="story-nome">Meu Story</span>
      </div>
    </div>
    <input type="file" id="inputStory" accept="image/*" style="display:none" onchange="publicarStory(event)">
  </div>
  <div id="storyViewer" style="display:none">
    <div class="story-info" id="storyAutor"></div>
    <img id="storyImg" src="">
    <button class="story-close" onclick="fecharStory()">✕</button>
  </div>
  <main id="feedDiv">
    <h2 style="margin-bottom:16px;">Feed</h2>
    <div id="trendingBar" style="display:none;"></div>
    <input type="text" id="pesquisaBox" placeholder="🔍 Pesquisar posts..." oninput="pesquisar()">
    <textarea id="caixaTexto" placeholder="O que você está pensando? Usa #hashtags!"></textarea>
    <br>
    <label class="img-label" for="inputImagem">🖼️ Adicionar imagem</label>
    <input type="file" id="inputImagem" accept="image/*" style="display:none" onchange="previewImagem(event)">
    <img id="imgPreview" class="img-preview">
    <div id="sondagemBox" style="display:none;margin-top:10px;background:#161920;border-radius:10px;padding:12px;">
      <p style="font-size:13px;font-weight:600;margin-bottom:8px;">📊 Sondagem</p>
      <input type="text" id="op1" placeholder="Opção 1..." style="width:100%;margin-bottom:6px;">
      <input type="text" id="op2" placeholder="Opção 2..." style="width:100%;margin-bottom:6px;">
      <input type="text" id="op3" placeholder="Opção 3 (opcional)..." style="width:100%;margin-bottom:6px;">
      <input type="text" id="op4" placeholder="Opção 4 (opcional)..." style="width:100%;margin-bottom:6px;">
    </div>
    <br>
    <button onclick="publicar()">Publicar</button>
    <button onclick="toggleSondagem()" id="btnSondagem" style="background:#2a2f42;">📊 Sondagem</button>
    <div id="posts"></div>
  </main>
  <div id="utilizadoresDiv" style="display:none">
    <h2 style="margin-bottom:16px;">👥 Utilizadores</h2>
    <div id="listaUtilizadores"></div>
  </div>
  <div id="gruposDiv" style="display:none">
    <h2 style="margin-bottom:16px;">🏘️ Grupos</h2>
    <input type="text" id="nomeGrupoInput" placeholder="Nome do grupo...">
    <textarea id="descGrupoInput" placeholder="Descrição..." style="height:60px;"></textarea>
    <button onclick="criarGrupo()">➕ Criar Grupo</button>
    <div id="listaGrupos"></div>
  </div>
  <div id="grupoDetalheDiv" style="display:none">
    <button onclick="verGrupos()" style="background:#6b7280;">⬅ Voltar</button>
    <h2 id="grupoNomeTitulo" style="margin:12px 0 4px;"></h2>
    <p id="grupoDescTexto" style="color:#6b7280;font-size:13px;margin-bottom:8px;"></p>
    <p style="font-size:13px;color:#6b7280;margin-bottom:8px;"><span id="grupoMembrosCount">0</span> membro(s)</p>
    <button id="btnEntrarGrupo" class="btn-seguir" onclick="toggleMembroGrupo()">➕ Entrar no grupo</button>
    <div id="grupoPostBox" style="display:none;margin-top:12px;">
      <textarea id="caixaTextoGrupo" placeholder="Escreva algo para o grupo...">
